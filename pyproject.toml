[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusionlab"
version = "0.1.0"
description = "DiffusionLab: Rigorous DDPM and DDIM research implementation in PyTorch"
authors = [{ name = "DiffusionLab Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tensorboard>=2.12.0",
    "tqdm>=4.65.0",
    "pillow>=9.5.0",
    "gradio>=4.0.0",
    "pytest>=7.3.0",
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
