# DiffusionLab Smoke Test Configuration (Rapid verification)
model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  channel_multipliers: [1, 2]
  num_res_blocks: 1
  attention_resolutions: []
  dropout: 0.0

diffusion:
  schedule_type: "linear"
  timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02

data:
  dataset_name: "fashion_mnist"
  data_dir: "data"
  img_size: 28
  batch_size: 16
  val_split: 0.1
  num_workers: 0
  subset_size: 64
  use_synthetic_fallback: true

training:
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  mixed_precision: false
  log_interval: 1
  sample_interval_epochs: 1
  save_interval_epochs: 1
  num_sample_images: 4
  run_dir: "runs/smoke_test"
  checkpoint_dir: "runs/smoke_test/checkpoints"
  sample_dir: "runs/smoke_test/samples"
