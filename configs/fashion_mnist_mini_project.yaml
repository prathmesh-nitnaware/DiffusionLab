# DiffusionLab — Fashion Image Generation Using DDPM
# College Mini-Project Demonstration Configuration
# Designed for practical, fast training (3 epochs on genuine Fashion-MNIST) with GPU support and CPU fallback.

model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  channel_multipliers: [1, 2]
  num_res_blocks: 1
  attention_resolutions: []
  dropout: 0.0
  num_classes: 10

diffusion:
  schedule_type: "cosine"
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

data:
  dataset_name: "fashion_mnist"
  data_dir: "data"
  img_size: 28
  batch_size: 64
  val_split: 0.1
  num_workers: 0
  subset_size: 3000  # 3,000 genuine Fashion-MNIST samples for practical mini-project training
  use_synthetic_fallback: false  # Explicitly require real data

training:
  epochs: 3
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  mixed_precision: false
  p_uncond: 0.1  # 10% condition dropout for CFG
  seed: 42
  log_interval: 15
  sample_interval_epochs: 1
  save_interval_epochs: 1
  num_sample_images: 16
  run_dir: "runs/fashion_mnist_mini_project"
  checkpoint_dir: "runs/fashion_mnist_mini_project/checkpoints"
  sample_dir: "runs/fashion_mnist_mini_project/samples"
