# Fast baseline model configuration for Fashion-MNIST
model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  channel_multipliers: [1, 2]
  num_res_blocks: 1
  attention_resolutions: []
  dropout: 0.0

diffusion:
  schedule_type: "cosine"
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

data:
  dataset_name: "fashion_mnist"
  data_dir: "data"
  img_size: 28
  batch_size: 32
  val_split: 0.1
  num_workers: 0
  subset_size: 1024
  use_synthetic_fallback: true

training:
  epochs: 3
  lr: 0.0005
  weight_decay: 0.0001
  max_grad_norm: 1.0
  mixed_precision: false
  log_interval: 10
  sample_interval_epochs: 1
  save_interval_epochs: 1
  num_sample_images: 16
  run_dir: "runs/fashion_mnist_baseline"
  checkpoint_dir: "runs/fashion_mnist_baseline/checkpoints"
  sample_dir: "runs/fashion_mnist_baseline/samples"
