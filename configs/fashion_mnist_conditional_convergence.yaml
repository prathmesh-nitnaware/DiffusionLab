# Fashion-MNIST Conditional Diffusion Convergence Configuration
# Scientific objective: Establish reproducible convergence on the full official Fashion-MNIST training partition.

model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  channel_multipliers: [1, 2]
  num_res_blocks: 1
  attention_resolutions: []
  dropout: 0.0
  num_classes: 10

diffusion:
  schedule_type: "cosine"
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

data:
  dataset_name: "fashion_mnist"
  data_dir: "data"
  img_size: 28
  batch_size: 64
  val_split: 0.1
  num_workers: 0
  subset_size: null  # Complete official training partition (54,000 train / 6,000 val)
  use_synthetic_fallback: false  # Explicitly disable synthetic fallback

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  mixed_precision: false
  p_uncond: 0.1  # 10% condition dropout for CFG
  seed: 42
  log_interval: 50
  sample_interval_epochs: 1
  save_interval_epochs: 1
  num_sample_images: 16
  run_dir: "runs/conditional_convergence"
  checkpoint_dir: "runs/conditional_convergence/checkpoints"
  sample_dir: "runs/conditional_convergence/samples"
